[pytest]
pythonpath = .
addopts = --strict-markers
# tests/v1_flaws needs v1 on PYTHONPATH and is DESIGNED to fail on v1, so the normal medoRa suite must not
# collect it. It is run only by tools/phase0/run_scorecard_flaws.py (explicit path, inside the v1 image).
# Setting norecursedirs replaces pytest's defaults, so those are repeated here.
norecursedirs = .* build dist node_modules venv __pycache__ *.egg v1_flaws bench/adr003/demo
# bench/adr003/demo is excluded from normal collection (ADR-003 H4 demo tests must not run
# in the standard suite). The harness runs them explicitly by path.
