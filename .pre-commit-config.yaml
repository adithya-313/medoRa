repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
        exclude: ^tests/v1_flaws/
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
        exclude: ^tests/v1_flaws/
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: lock-in-sync
        name: lock in sync
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ts-typecheck
        name: ts-typecheck
        entry: npm run typecheck
        language: system
        files: ^(desktop|owner|admin)/.*\.ts$|^(tsconfig\.json|eslint\.config\.mjs|package(-lock)?\.json)$
        pass_filenames: false
      - id: ts-lint
        name: ts-lint
        entry: npm run lint
        language: system
        files: ^(desktop|owner|admin)/.*\.ts$|^(tsconfig\.json|eslint\.config\.mjs|package(-lock)?\.json)$
        pass_filenames: false

