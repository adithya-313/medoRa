[project]
name = "medora"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pyyaml",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20261103",
]
adr002 = [
    "growthbook>=4.0.0",
    "unleashclient>=6.9.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/v1_flaws"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C90"]
# E501 is ignored on purpose: the formatter enforces 110 where it can.
# The rest are long strings and comments it cannot split.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
files = ["showcase", "tools", "bench", "tests", "cloud"]
exclude = ["tests/v1_flaws/"]
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["UnleashClient.*", "growthbook.*"]
ignore_missing_imports = true

