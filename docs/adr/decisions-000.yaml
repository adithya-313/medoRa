# Carry-over decisions for ADR-000. Every v1 feature, data item, screen action, module and service has exactly one.
# tools/phase0/adr_000.py checks coverage, rules and every evidence reference, then renders the ADR.
adr_date: '2026-10-22'
adr_status: Accepted
owner_decisions:
- text: v2 gets a new UI design; v1's look is not carried over.
  date: 2026-10-20/21
- text: Drug interactions are reference information only (possible SaMD).
  date: 2026-10-20/21
- text: Tauri v2 is the desktop shell.
  date: 2026-10-20/21
- text: v1's 254k-row product CSV is a test fixture only.
  date: 2026-10-20/21
- text: Prescription reading and the Malayalam voice assistant move to v3 (neither exists in v1, so no v1 item is deferred).
  date: 2026-10-20/21
- text: 'Planned drops in the owner''s plan: the Kafka producer with Redpanda, the SGWA service with the federated API, and the compute hypervisor.'
  date: 2026-10-20/21
- text: 'Clinical safety judge: rebuild as warn-only (the pharmacist confirms with a reason, which is logged); no hard checkout lock; Phase 6.'
  date: '2026-10-22'
- text: 'Every other item that was listed as ''Owner to confirm'': the proposed choice is accepted.'
  date: '2026-10-22'
