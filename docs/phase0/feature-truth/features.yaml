# v1 feature-truth inventory. Paths are relative to sentinel_flow_mvp at tag v1-final (3b121e1).
# Test evidence cites rows of results.json in docs/phase0/v1-test-results/<run>/ as "file::name",
# exactly as written there (file = the junit classname). Verified by tools/phase0/feature_truth.py.
# Notes on how to read statuses:
#   - A feature whose only tests FAIL is "broken", even when the cause may be stale test data or an
#     empty test database. The note says what the failure actually was.
#   - UI pages are "untested": the Playwright specs in frontend/tests were not run (needs full stack).
