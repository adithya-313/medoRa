# What each v1 screen DOES (not how it looks). Every claim carries code evidence that tools/phase0/screen_inventory.py
# re-checks against a fresh clone of v1-final. Paths are relative to sentinel_flow_mvp.
pages:
- route: /
  file: frontend/src/app/page.tsx
  purpose: Redirects straight to the point-of-sale screen; it shows nothing itself.
  user_actions:
  - name: Open the app root
    evidence:
    - type: code
      file: frontend/src/app/page.tsx
      line: 4
      contains: redirect('/pos')
    api_calls: []
    features:
    - ui-pos-page
  data_shown:
  - what: 'Nothing: the page only redirects'
    source: local-state
    evidence:
    - type: code
      file: frontend/src/app/page.tsx
      line: 3
      contains: export default function Home
  components: []
  linked_features:
  - ui-pos-page
- route: /pos
  file: frontend/src/app/pos/page.tsx
  purpose: 'The counter screen: find medicines, build a cart, identify the patient by phone, see recommendations and clinical warnings, ask the clinical copilot, and take payment.'
