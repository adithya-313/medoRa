    - inventory-search
  - name: Pay with cash, UPI or card (submits the cart)
    evidence:
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 173
      contains: api.submitCheckout(cart
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 605
      contains: onClick={() => executeCheckout('CASH')}
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 613
      contains: onClick={() => executeCheckout('UPI')}
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 621
      contains: onClick={() => executeCheckout('CARD')}
    api_calls:
    - POST /api/v1/pos/checkout
