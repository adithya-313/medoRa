    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 131
      contains: api.searchInventory(searchQuery)
    api_calls:
    - GET /api/v1/inventory/search
    features:
    - inventory-search
  - name: Add, reduce or remove cart items
    evidence:
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 567
      contains: 'onClick={() => addItem({ ...item, quantity: 1 })}'
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 557
      contains: onClick={() => decrementItem(item.batch_id)}
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 580
      contains: onClick={() => removeItem(item.batch_id)}
    api_calls: []
    features: []
  - name: Look up the patient by a 10-digit phone number
    evidence:
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 156
      contains: api.lookupPatient(phone)
    api_calls:
    - GET /api/v1/pos/patient/lookup/{param}
    features:
    - pos-patient-lookup
  - name: See clinical cross-sell and cheaper generic suggestions for the last item added
    evidence:
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 96
      contains: fetchRecommendations(lastItem.sku_id)
    api_calls:
    - GET /api/v1/pos/recommendations/{param}
    features:
    - pos-recommendations
  - name: Add a suggested item to the cart (looks up its price if missing)
    evidence:
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 439
      contains: onAddItem={async (item) => {
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 444
      contains: api.searchInventory(item.sku_id)
    api_calls:
    - GET /api/v1/inventory/search
    features:
