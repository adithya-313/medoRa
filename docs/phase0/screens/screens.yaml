must_keep:
- page: /pos
  action: Search medicines by name or SKU (2+ characters, 300 ms debounce)
  feature: inventory-search
  reason: The counter cannot sell without finding stock; v1 never tested this path.
- page: /pos
  action: Add, reduce or remove cart items
  feature: ui-pos-page
  reason: Cart editing is client-side logic in the POS page that v2's counter screen needs.
- page: /pos
  action: Look up the patient by a 10-digit phone number
  feature: pos-patient-lookup
  reason: Known patients are filled in automatically at checkout; untested in v1.
- page: /pos
  action: See clinical cross-sell and cheaper generic suggestions for the last item added
  feature: pos-recommendations
  reason: Margin and clinical value at the counter; untested in v1.
- page: /pos
  action: Pay with cash, UPI or card (submits the cart)
  feature: pos-checkout
  reason: The core sale; tested against a real database (stock deducted, audit entries).
- page: /pos
  action: Ask the clinical copilot a question (with the cart as context)
  feature: kb-routing
  reason: Question routing, caching and degraded mode are tested; answer quality is not (see kb-answer).
- page: /pos
  action: Checkout is locked when the copilot says a drug is unsafe; override the lock
  feature: clinical-safety-judge
  reason: The safety rules are tested logic that blocks dangerous sales; keep the lock and an auditable override.
- page: /pos
  action: Open the inventory triage dashboard
  feature: inventory-triage
  reason: Expiry and capital-at-risk overview; untested, and v1's query has no tenant filter.
- page: /pos
  action: Read notifications and open one (marks it read, then goes to /orders or /health-risk-radar)
  feature: notifications-api
  reason: Surfaces overdue orders and disease warnings; untested endpoints.
- page: /pos
  action: See and expand the health-risk warning banner
  feature: health-risk-api
  reason: Real scores with an explain view; tested against mocked database results.
- page: /history
  action: Open the page and load the transaction history
  feature: pos-history
  reason: Receipt history per tenant; tested.
- page: /audit-log
  action: Load the audit log page (50 entries at a time)
  feature: audit-log-api
  reason: Audit trail with tenant isolation; tested.
- page: /audit-log
  action: Expand an entry to see the before and after values
  feature: audit-log-api
  reason: The before/after diff is what makes the log useful.
- page: /health-risk-radar
  action: Open the radar (loads current scores and 30 days of history)
  feature: health-risk-api
  reason: Current and history views are tested; the scoring job behind them is broken in v1 (health-risk-ingestion-job).
- page: /orders
  action: Open the ledger and load all purchase orders
  feature: po-list
  reason: Order ledger; tested.
- page: /orders
  action: Record a delivery (date and received quantity per item)
  feature: po-receive
  reason: Needed to close orders; v1's tests of this path FAIL, so v2 must build it with working tests.
- page: /suppliers
  action: Open the page and load the vendor list
  feature: supplier-list
  reason: Vendor list with paging; tested with a mocked database session.
- page: /suppliers
  action: Add a vendor (name and contact e-mail)
  feature: supplier-create
  reason: Tested with a real database.
- page: /suppliers
  action: See a vendor's scorecard (trust score, delivery rate, financial loss)
  feature: supplier-scorecard
  reason: Wanted by pharmacists, but v1's formula has 8 proven flaws; keep the screen, redesign the calculation.
- page: /suppliers
  action: Search the catalogue and order stock from a vendor
  feature: po-create
  reason: Needed to buy stock; v1's order-creation tests FAIL, so rebuild with tests.
- page: /suppliers
  action: View a vendor's order history (can sort delayed first)
  feature: supplier-orders
  reason: Tested with a real database.
- page: /admin/settings
  action: Save the settings
  feature: tenant-settings
  reason: Pharmacy-level WhatsApp/UPI configuration; untested in v1.
rebuild_in_v2:
- page: all pages
  action: Every screen acts as the fixed tenant PHARM-001 (no login or tenant choice)
  feature: ui-authentication
  reason: 'v1 has no real sign-in: the browser sends a constant tenant id and the backend defaults a missing one to system_admin.'
- page: none
  action: Disease-wave stock alert with a one-click automatic purchase order
