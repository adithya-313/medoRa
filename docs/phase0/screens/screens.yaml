    - type: code
      file: frontend/src/components/pos/CopilotPanel.tsx
      line: 73
      contains: fetch('/api/v1/knowledge-base/ask'
    - type: code
      file: frontend/src/app/pos/page.tsx
      line: 265
      contains: onClick={toggleCopilot}
    api_calls:
    - POST /api/v1/knowledge-base/ask
    features:
    - kb-routing
    - kb-answer
